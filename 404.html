<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ページが見つかりません - ふたりあそび</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<style>
/* 存在しないURLで表示するページ。どの階層でも表示が崩れないよう、パスは / から始める */
.nf{min-height:100vh;min-height:100svh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.nf .mk{display:flex}
.nf .mk i{width:22px;height:22px;border-radius:50%;display:block}
.nf .mk i:first-child{background:var(--p1)}
.nf .mk i:last-child{background:var(--p2);margin-left:-6px;opacity:.9}
.nf h1{margin:0;font-size:24px;font-weight:800}
.nf p{margin:0;color:var(--muted);font-size:14px;line-height:1.8}
.nf a{margin-top:8px;display:inline-block;padding:12px 24px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:800;text-decoration:none}
.nf a:focus-visible{outline:2px solid var(--hl);outline-offset:3px}
</style>
</head>
<body>
<main class="nf">
  <span class="mk" aria-hidden="true"><i></i><i></i></span>
  <h1>ページが見つかりません</h1>
  <p>URLがまちがっているか、ページが移動した可能性があります。<br>ゲーム一覧から遊びたいゲームを選んでください。</p>
  <a href="/">ゲーム一覧へ</a>
</main>
</body>
</html>
