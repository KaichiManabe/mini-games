<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>陣取りドット</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<style>
/* Layout: one-screen pass-and-play board; score strip on top, board centered, controls below */
:root{--dot:#1d2433; --line-empty:#cfd5e1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--dot:#e8ecf4; --line-empty:#2c3346}}
:root[data-theme="dark"]{--dot:#e8ecf4; --line-empty:#2c3346}
body.game{max-width:520px;gap:14px}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{background:var(--card);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
  border:2px solid transparent;transition:border-color .2s,transform .2s}
.pl .name{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.pl .sw{width:12px;height:12px;border-radius:50%}
.pl .pt{font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
#s1 .sw{background:var(--p1)} #s1 .pt{color:var(--p1)}
#s2 .sw{background:var(--p2)} #s2 .pt{color:var(--p2)}
#s1.on{border-color:var(--p1);transform:translateY(-2px)}
#s2.on{border-color:var(--p2);transform:translateY(-2px)}
.msg{text-align:center;font-size:14px;color:var(--muted);min-height:20px}
.msg b{color:var(--fg)}
.board{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
svg{width:100%;max-width:440px;height:auto;touch-action:manipulation}
.ln{stroke:var(--line-empty);stroke-width:7;stroke-linecap:round;transition:stroke .15s}
.hit{stroke:transparent;stroke-width:34;cursor:pointer}
.hit:hover + .ln.free{stroke:var(--muted)}
.ln.a{stroke:var(--p1)} .ln.b{stroke:var(--p2)}
.ln.last{stroke-width:9}
.box{transition:fill .2s}
.box.a{fill:var(--p1-soft)} .box.b{fill:var(--p2-soft)}
.box text{font-weight:800}
.dot{fill:var(--dot)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font-family:var(--font);font-size:14px;font-weight:800;border:0;border-radius:999px;padding:10px 16px;
  background:var(--card);color:var(--fg);cursor:pointer}
button:focus-visible{outline:2px solid var(--p1);outline-offset:2px}
button.sel{background:var(--fg);color:var(--bg)}
button:disabled{opacity:.4}
.rule{font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
/* PC：盤面を画面の高さいっぱいまで大きく */
@media (min-width:880px) and (min-aspect-ratio:1/1){body.game.split{max-width:1100px}
  svg{max-width:min(720px,calc(100dvh - 90px))}
  .rule{text-align:left;margin:0}}
</style>
</head>
<body class="game split">
<a class="back" href="../index.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>トップへ戻る</a>

<div class="top">
<div class="scores">
  <div class="pl" id="s1"><span class="name"><span class="sw"></span>あお</span><span class="pt" id="p1">0</span></div>
  <div class="pl" id="s2"><span class="name"><span class="sw"></span>ピンク</span><span class="pt" id="p2">0</span></div>
</div>
<div class="msg" id="msg"></div>
</div>
<div class="board stage"><svg id="svg"></svg></div>
<div class="bottom">
<div class="ctl">
  <button id="undo">1手戻す</button>
  <button data-n="3">3×3</button>
  <button data-n="4">4×4</button>
  <button data-n="5">5×5</button>
  <button data-n="6">6×6</button>
</div>
<p class="rule">交互に線を1本引く。四角を閉じたらその陣地を獲得して、もう1本引ける。<br>線が全部埋まったとき、陣地が多いほうの勝ち。</p>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
let N=4,h,v,own,turn,score,hist,last;
const G=60,PAD=20;

function reset(n){
  N=n;
  h=Array.from({length:N+1},()=>Array(N).fill(0));
  v=Array.from({length:N},()=>Array(N+1).fill(0));
  own=Array.from({length:N},()=>Array(N).fill(0));
  turn=1;score=[0,0,0];hist=[];last=null;
  document.querySelectorAll('[data-n]').forEach(b=>b.classList.toggle('sel',+b.dataset.n===N));
  draw();
}
function boxDone(r,c){return h[r][c]&&h[r+1][c]&&v[r][c]&&v[r][c+1]}
function play(t,r,c){
  const arr=t==='h'?h:v; if(arr[r][c]) return;
  hist.push(JSON.stringify({h,v,own,turn,score,last}));
  arr[r][c]=turn; last=t+r+'-'+c;
  const cand=t==='h'?[[r-1,c],[r,c]]:[[r,c-1],[r,c]];
  let got=0;
  for(const [br,bc] of cand){
    if(br<0||bc<0||br>=N||bc>=N||own[br][bc]) continue;
    if(boxDone(br,bc)){own[br][bc]=turn;score[turn]++;got++}
  }
  if(!got) turn=3-turn;
  draw();
}
function undo(){ if(!hist.length) return; const s=JSON.parse(hist.pop()); ({h,v,own,turn,score,last}=s); draw(); }
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}
function draw(){
  const S=N*G+PAD*2; svg.setAttribute('viewBox',`0 0 ${S} ${S}`); svg.innerHTML='';
  const X=c=>PAD+c*G, Y=r=>PAD+r*G;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const o=own[r][c]; const g=el('g',{class:'box'+(o===1?' a':o===2?' b':'')},svg);
    el('rect',{x:X(c),y:Y(r),width:G,height:G,fill:o?'':'transparent',class:'box'+(o===1?' a':o===2?' b':'')},g);
    if(o){const t=el('text',{x:X(c)+G/2,y:Y(r)+G/2+8,'text-anchor':'middle','font-size':22,fill:o===1?'var(--p1)':'var(--p2)'},g);t.textContent=o===1?'あ':'ピ'}
  }
  const seg=(t,r,c,x1,y1,x2,y2,val)=>{
    const g=el('g',{},svg);
    const hit=el('line',{x1,y1,x2,y2,class:'hit'},g);
    el('line',{x1,y1,x2,y2,class:'ln '+(val===1?'a':val===2?'b':'free')+(last===t+r+'-'+c?' last':'')},g);
    if(!val) hit.addEventListener('click',()=>play(t,r,c));
  };
  for(let r=0;r<=N;r++)for(let c=0;c<N;c++) seg('h',r,c,X(c)+8,Y(r),X(c+1)-8,Y(r),h[r][c]);
  for(let r=0;r<N;r++)for(let c=0;c<=N;c++) seg('v',r,c,X(c),Y(r)+8,X(c),Y(r+1)-8,v[r][c]);
  for(let r=0;r<=N;r++)for(let c=0;c<=N;c++) el('circle',{cx:X(c),cy:Y(r),r:5.5,class:'dot'},svg);
  document.getElementById('p1').textContent=score[1];
  document.getElementById('p2').textContent=score[2];
  const done=score[1]+score[2]===N*N;
  document.getElementById('s1').classList.toggle('on',!done&&turn===1);
  document.getElementById('s2').classList.toggle('on',!done&&turn===2);
  const m=document.getElementById('msg');
  if(done){ m.innerHTML=score[1]===score[2]?'<b>引き分け！</b> サイズを押すとリスタート':`<b>${score[1]>score[2]?'あお':'ピンク'}の勝ち！</b> サイズを押すとリスタート`; }
  else m.innerHTML=`<b>${turn===1?'あお':'ピンク'}</b>の番`;
  document.getElementById('undo').disabled=!hist.length;
}
document.querySelectorAll('[data-n]').forEach(b=>b.addEventListener('click',()=>reset(+b.dataset.n)));
document.getElementById('undo').addEventListener('click',undo);
reset(4);
</script>

</body>
</html>
