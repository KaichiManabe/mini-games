<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ニム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<style>
[hidden]{display:none!important}
/* Layout: one-screen. Turn strip, setup switch, stacked rows of stones (one row per pile), take button, rule line. */
:root{--stone:#8a93a8; --stone-hi:#b5bccb; --take:#f0b429}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stone:#6b7590; --stone-hi:#8f99b3}}
:root[data-theme="dark"]{--stone:#6b7590; --stone-hi:#8f99b3}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{background:var(--card);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:800;border:2px solid transparent;transition:border-color .2s}
.pl .mk{width:22px;height:22px;border-radius:50%}
#s1 .mk{background:var(--p1)} #s2 .mk{background:var(--p2)}
#s1.on{border-color:var(--p1)} #s2.on{border-color:var(--p2)}
.pl .w{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border-radius:999px;padding:4px}
.modes button{font-family:var(--font);font-weight:800;font-size:13px;border:0;border-radius:999px;padding:8px 4px;background:transparent;color:var(--muted);cursor:pointer}
.modes button.sel{background:var(--fg);color:var(--bg)}
.msg{text-align:center;font-size:14px;color:var(--muted);min-height:20px;margin:0}
.msg b{color:var(--fg)}
.piles{background:var(--card);border-radius:16px;padding:16px 12px;display:flex;flex-direction:column;gap:14px}
.pile{display:flex;align-items:center;gap:10px}
.pile .lb{width:28px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;flex:none}
.stones{display:flex;gap:8px;flex-wrap:wrap;min-height:34px;align-items:center}
.st{width:34px;height:34px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 35% 30%,var(--stone-hi),var(--stone) 70%);cursor:pointer;transition:transform .12s,background .12s}
.st.sel{background:var(--take);transform:translateY(-4px) scale(.92)}
.st:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.st:disabled{cursor:default}
.empty{font-size:12px;color:var(--muted)}
.ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctl button{font-family:var(--font);font-size:14px;font-weight:800;border:0;border-radius:999px;padding:10px 18px;background:var(--card);color:var(--fg);cursor:pointer}
.ctl button.main{background:var(--take);color:#2a1d00}
.ctl button:disabled{opacity:.4}
.ctl button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.rule{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;margin:0}
@media (prefers-reduced-motion:reduce){.st{transition:none}}
/* PC：石を大きく */
@media (min-width:880px) and (min-aspect-ratio:1/1){
  .piles{padding:28px 24px;gap:22px} .st{width:52px;height:52px} .stones{gap:12px;min-height:52px} .pile .lb{width:40px;font-size:14px}
  .rule{text-align:left}}
</style>
</head>
<body class="game split">
<a class="back" href="../index.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>トップへ戻る</a>
<div class="top">
<div class="scores">
  <div class="pl" id="s1"><span class="mk"></span>あお<span class="w" id="w1">0勝</span></div>
  <div class="pl" id="s2"><span class="mk"></span>ピンク<span class="w" id="w2">0勝</span></div>
</div>
<div class="modes"><button data-m="std">1・3・5・7</button><button data-m="small">3・4・5</button><button data-m="rand">ランダム</button></div>
<p class="msg" id="msg"></p>
</div>
<div class="piles stage" id="piles"></div>
<div class="bottom">
<div class="ctl"><button class="main" id="take" disabled>取る</button><button id="undo">1手戻す</button><button id="new">新しいゲーム</button></div>
<p class="rule">自分の番に、どれか1つの山から好きな数だけ石を取る（1個以上）。<br><b>最後の1個を取ったほうが負け。</b> 石をタップすると、そこから右の石がまとめて選ばれる。</p>
</div>
<script>
let mode='std',P,turn,sel,hist,over,wins=[0,0,0];
function reset(){
  P=mode==='std'?[1,3,5,7]:mode==='small'?[3,4,5]:Array.from({length:3+(Math.random()*2|0)},()=>2+(Math.random()*6|0));
  turn=Math.random()<.5?1:2;sel=null;hist=[];over=false;
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('sel',b.dataset.m===mode));
  draw();
}
function take(){
  if(!sel)return;hist.push({P:P.slice(),turn});
  P[sel.p]=sel.i;sel=null;
  if(P.every(n=>n===0)){over=3-turn;wins[over]++;}
  else turn=3-turn;
  draw();
}
function draw(){
  const box=document.getElementById('piles');box.innerHTML='';
  P.forEach((n,p)=>{
    const row=document.createElement('div');row.className='pile';
    row.innerHTML=`<span class="lb">${n}個</span>`;
    const st=document.createElement('div');st.className='stones';
    if(!n)st.innerHTML='<span class="empty">なし</span>';
    for(let i=0;i<n;i++){
      const b=document.createElement('button');b.className='st'+(sel&&sel.p===p&&i>=sel.i?' sel':'');
      b.setAttribute('aria-label',`${p+1}つ目の山から${n-i}個選ぶ`);b.disabled=!!over;
      b.onclick=()=>{sel=(sel&&sel.p===p&&sel.i===i)?null:{p,i};draw();};
      st.appendChild(b);
    }
    row.appendChild(st);box.appendChild(row);
  });
  const nm=p=>p===1?'あお':'ピンク';
  document.getElementById('s1').classList.toggle('on',!over&&turn===1);
  document.getElementById('s2').classList.toggle('on',!over&&turn===2);
  document.getElementById('w1').textContent=wins[1]+'勝';document.getElementById('w2').textContent=wins[2]+'勝';
  const left=P.reduce((a,b)=>a+b,0);
  document.getElementById('msg').innerHTML=over?`<b>${nm(over)}の勝ち！</b>（${nm(3-over)}が最後の1個を取った）`:`<b>${nm(turn)}</b>の番　残り${left}個`;
  const t=document.getElementById('take');t.disabled=!sel;t.textContent=sel?`${P[sel.p]-sel.i}個取る`:'取る';
  document.getElementById('undo').disabled=!hist.length;
}
document.getElementById('take').onclick=take;
document.getElementById('undo').onclick=()=>{if(!hist.length)return;if(over)wins[over]--;over=false;({P,turn}=hist.pop());sel=null;draw();};
document.getElementById('new').onclick=reset;
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;reset();});
reset();
</script>
</body>
</html>
